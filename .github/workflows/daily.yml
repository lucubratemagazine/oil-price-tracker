name: Daily

on:
  schedule:
    - cron: "0 6 * * *"   # Kjør hver dag kl 06:00 UTC
  workflow_dispatch:       # Lar deg kjøre manuelt

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch oil price
        run: python fetch_oil_price.py

      - name: Generate chart
        run: python generate_chart.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add history.csv oil_price_chart.png
          git commit -m "Update data" || echo "No changes to commit"
          git push
