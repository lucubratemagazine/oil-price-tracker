<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oil Price Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 800px;
        }
        #latest {
            background: #eef6ff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        #change30d {
            font-weight: bold;
            margin-top: 6px;
        }
        img {
            width: 100%;
            border-radius: 8px;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }
        th, td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #f0f0f0;
        }
    </style>
</head>
<body>

    <h1>Oil Price Tracker</h1>

    <div id="latest">
        <p id="latestPrice">Loading latest price...</p>
        <p id="change30d"></p>
    </div>

    <h2>Historical Chart</h2>
    <img src="chart.png" alt="Oil Price Chart">

    <h2>History</h2>
    <table id="historyTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>EIA Price (USD)</th>
                <th>Yahoo Price (USD)</th>
            </tr>
        </thead>
        <tbody id="historyBody"></tbody>
    </table>

    <script>
        // Load latest price from CSV
        fetch("history.csv")
            .then(r => r.text())
            .then(text => {
                const rows = text.trim().split("\n").slice(1);
                const last = rows[rows.length - 1].split(",");

                const date = last[0];
                const eia = last[1];
                const yahoo = last[2];

                const price = yahoo !== "NaN" ? yahoo : eia;

                document.getElementById("latestPrice").innerHTML =
                    `Latest price: <strong>${price} USD</strong> (${date})`;
            });

        // Load 30-day change
        fetch("change30d.txt")
            .then(r => r.text())
            .then(val => {
                const num = parseFloat(val);
                if (isNaN(num)) return;

                const color = num >= 0 ? "green" : "red";
                document.getElementById("change30d").innerHTML =
                    `30‑day change: <span style="color:${color}">${num}%</span>`;
            });

        // Load history table
        fetch("history.csv")
            .then(r => r.text())
            .then(text => {
                const rows = text.trim().split("\n").slice(1);
                const body = document.getElementById("historyBody");

                rows.reverse().forEach(row => {
                    const cols = row.split(",");
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${cols[0]}</td>
                        <td>${cols[1]}</td>
                        <td>${cols[2]}</td>
                    `;
                    body.appendChild(tr);
                });
            });
    </script>

</body>
</html>
