<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Oil Price Tracker</title>
    <style>
        :root {
            --bg: #f7f7f7;
            --text: #111;
            --card-bg: #fff;
            --accent: #4da3ff;
        }

        /* Dark mode variables */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --text: #eaeaea;
                --card-bg: #1e1e1e;
                --accent: #4da3ff;
            }
        }

        /* Manual override */
        body.dark {
            --bg: #121212;
            --text: #eaeaea;
            --card-bg: #1e1e1e;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .toggle {
            text-align: center;
            margin-bottom: 20px;
        }

        .toggle button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }

        .price-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            font-size: 1.4rem;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        img {
            width: 100%;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<h1>Oil Price Tracker</h1>

<div class="toggle">
    <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
</div>

<div class="price-box">
    <strong>Latest price:</strong>
    <span id="latest-price">Loading...</span>
</div>

<h2>Historical Chart</h2>
<img src="chart.png" alt="Oil price chart">

<script>
    async function loadLatestPrice() {
        const response = await fetch("history.csv");
        const text = await response.text();
        const lines = text.trim().split("\n");
        const last = lines[lines.length - 1].split(",");
        const date = last[0];
        const price = last[1];
        document.getElementById("latest-price").textContent = `${price} USD (${date})`;
    }

    function toggleDarkMode() {
        document.body.classList.toggle("dark");
    }

    loadLatestPrice();
</script>

</body>
</html>
