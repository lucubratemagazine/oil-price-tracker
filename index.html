<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oil Price Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 800px;
        }

        #latest {
            background: #eef6ff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        #change30d {
            font-weight: bold;
            margin-top: 6px;
        }

        img {
            width: 100%;
            border-radius: 8px;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            font-size: 15px;
        }

        th, td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f0f0f0;
        }

        @media (max-width: 600px) {
            table {
                font-size: 14px;
            }
            th, td {
                padding: 6px;
            }
        }

        #themeBtn {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            background: #333;
            color: white;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <button id="themeBtn">Toggle Dark Mode</button>

    <h1>Oil Price Tracker</h1>

    <div id="latest">
        <p id="latestPrice">Loading latest price...</p>
        <p id="change30d"></p>
    </div>

    <h2>Historical Chart</h2>
    <img id="chartImg" src="chart_light.png" alt="Oil Price Chart">

    <h2>History</h2>
    <table id="historyTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>EIA Price (USD)</th>
                <th>Yahoo Price (USD)</th>
            </tr>
        </thead>
        <tbody id="historyBody"></tbody>
    </table>

    <script>
        // Load latest price
        fetch("history.csv")
            .then(r => r.text())
            .then(text => {
                const rows = text.trim().split("\n").slice(1);
                const last = rows[rows.length - 1].split(",");

                const date = last[0];
                const eia = parseFloat(last[1]);
                const yahoo = parseFloat(last[2]);

                const price = !isNaN(yahoo) ? yahoo.toFixed(2) : eia.toFixed(2);

                document.getElementById("latestPrice").innerHTML =
                    `Latest price: <strong>${price} USD</strong> (${date})`;
            });

        // Load 30-day change
        fetch("change30d.txt")
            .then(r => r.text())
            .then(val => {
                const num = parseFloat(val);
                if (isNaN(num)) return;

                const color = num >= 0 ? "green" : "red";
                document.getElementById("change30d").innerHTML =
                    `30‑day change: <span style="color:${color}">${num.toFixed(2)}%</span>`;
            });

        // Load history table
        fetch("history.csv")
            .then(r => r.text())
            .then(text => {
                const rows = text.trim().split("\n").slice(1);
                const body = document.getElementById("historyBody");

                rows.reverse().forEach(row => {
                    const cols = row.split(",");
                    const date = cols[0];
                    const eia = parseFloat(cols[1]);
                    const yahoo = parseFloat(cols[2]);

                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${date}</td>
                        <td>${!isNaN(eia) ? eia.toFixed(2) : "NaN"}</td>
                        <td>${!isNaN(yahoo) ? yahoo.toFixed(2) : "NaN"}</td>
                    `;
                    body.appendChild(tr);
                });
            });

        // THEME SWITCHER
        const chartImg = document.getElementById("chartImg");
        const themeBtn = document.getElementById("themeBtn");

        function applyTheme() {
            const dark = localStorage.getItem("darkmode") === "1";
            chartImg.src = dark ? "chart_dark.png" : "chart_light.png";
            themeBtn.textContent = dark ? "Switch to Light Mode" : "Switch to Dark Mode";
        }

        themeBtn.onclick = () => {
            const dark = localStorage.getItem("darkmode") === "1";
            localStorage.setItem("darkmode", dark ? "0" : "1");
            applyTheme();
        };

        applyTheme();
    </script>

</body>
</html>
