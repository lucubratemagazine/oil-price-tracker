<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Oil Price Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

    <style>
        :root {
            --bg: #ffffff;
            --text: #111111;
            --card-bg: #f5f5f5;
            --accent: #4da3ff;
        }

        body.dark {
            --bg: #111111;
            --text: #f5f5f5;
            --card-bg: #1e1e1e;
            --accent: #4da3ff;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 0.5rem;
        }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        button:hover {
            opacity: 0.9;
        }

        .card {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }

        #chart {
            width: 100%;
            height: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 0.85rem;
        }

        th, td {
            padding: 0.35rem 0.5rem;
            border-bottom: 1px solid #ccc;
        }

        th {
            text-align: left;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Oil Price Tracker</h1>
    <button id="toggle-theme">Toggle Dark Mode</button>

    <div class="card">
        <strong>Latest price:</strong>
        <span id="latest-price">Loading...</span>
    </div>

    <h2>Interactive Historical Chart</h2>
    <div id="chart"></div>

    <h3>History</h3>
    <table id="table">
        <thead>
        <tr>
            <th>Date</th>
            <th>Price (USD)</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    // Dark mode toggle
    const body = document.body;
    const toggleBtn = document.getElementById("toggle-theme");

    if (localStorage.getItem("theme") === "dark") {
        body.classList.add("dark");
    }

    toggleBtn.addEventListener("click", () => {
        body.classList.toggle("dark");
        localStorage.setItem("theme", body.classList.contains("dark") ? "dark" : "light");
    });

    // Datoformat: "6 Apr 2026"
    function formatDate(dateStr) {
        const d = new Date(dateStr);
        return d.toLocaleDateString("en-GB", {
            day: "numeric",
            month: "short",
            year: "numeric"
        });
    }

    async function loadData() {
        const response = await fetch("history.csv?cache=" + Date.now());
        const text = await response.text();
        const lines = text.trim().split("\n").slice(1); // hopp over header

        const dates = [];
        const prices = [];

        lines.forEach(line => {
            const [date, price] = line.split(",");

            // Rens datoen (fjern evt. klokkeslett)
            const cleanDate = date.split("T")[0];

            // Formater datoen som "6 Apr 2026"
            dates.push(formatDate(cleanDate));

            prices.push(parseFloat(price));
        });

        // Latest price
        const latestPrice = prices[prices.length - 1];
        const latestDate = dates[dates.length - 1];
        document.getElementById("latest-price").textContent =
            `${latestPrice.toFixed(2)} USD (${latestDate})`;

        // Price change (valgfritt, men greit å ha)
        if (prices.length > 1) {
            const prevPrice = prices[prices.length - 2];
            const diff = latestPrice - prevPrice;
            const sign = diff >= 0 ? "+" : "-";
            document.getElementById("latest-price").textContent +=
                ` ${sign}${Math.abs(diff).toFixed(2)}`;
        }

        // Fyll tabellen (nyeste øverst)
        const tbody = document.querySelector("#table tbody");
        tbody.innerHTML = "";
        const reversed = [...lines].reverse();
        reversed.forEach(line => {
        const [date, eia, yahoo] = line.split(",");
        dates.push(formatDate(date));
        eiaPrices.push(parseFloat(eia));
        yahooPrices.push(parseFloat(yahoo));

            const cleanDate = date.split("T")[0];
            const formatted = formatDate(cleanDate);
            const row = `<tr><td>${formatted}</td><td>${parseFloat(price).toFixed(2)}</td></tr>`;
            tbody.innerHTML += row;
        });

        // Plotly trace
        const trace = {
            x: dates,
            y: prices,
            mode: "lines+markers",
            line: { color: "#4da3ff", width: 3 },
            marker: { size: 6 }
        };

        const layout = {
            height: 300,   // ← juster høyden her
            margin: { t: 20, r: 20, l: 40, b: 40 },
            paper_bgcolor: "var(--bg)",
            plot_bgcolor: "var(--bg)",
            font: { color: "var(--text)" },
            xaxis: {
                type: "category",
                tickangle: -45,
                tickmode: "auto",
                nticks: 12,
                automargin: true,
                tickson: "boundaries"
            },
            transition: { duration: 500 }
        };

        const config = {
            responsive: true,
            displaylogo: false,
            modeBarButtonsToAdd: ["resetScale2d"]
        };
const traceEIA = {
    x: dates,
    y: eiaPrices,
    mode: "lines+markers",
    name: "EIA (offisiell)",
    line: { color: "#4da3ff", width: 3 }
};

const traceYahoo = {
    x: dates,
    y: yahooPrices,
    mode: "lines+markers",
    name: "Yahoo Finance (sanntid)",
    line: { color: "#ff9933", width: 3 }
};

Plotly.newPlot("chart", [traceEIA, traceYahoo], layout, config);

    }

    // Auto-refresh every 60 seconds
    setInterval(loadData, 60000);

    loadData();
</script>
</body>
</html>
