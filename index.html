<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oil Price Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 800px;
        }

        #latest {
            background: #eef6ff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        #change30d {
            font-weight: bold;
            margin-top: 6px;
        }

        img {
            width: 100%;
            border-radius: 8px;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            font-size: 15px;
        }

        th, td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f0f0f0;
        }

        @media (max-width: 600px) {
            table {
                font-size: 14px;
            }
            th, td {
                padding: 6px;
            }
        }

        #themeBtn {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            background: #333;
            color: white;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <button id="themeBtn">Toggle Dark Mode</button>

    <h1>Oil Price Tracker</h1>

    <div id="latest">
        <p id="latestPrice">Loading latest price…</p>
        <p id="change30d">Loading 30&#8209;day change…</p>
    </div>

    <h2>Historical Chart</h2>
    <img id="chartImg" src="chart_light.png" alt="Oil Price Chart">

    <h2>History</h2>
    <table id="historyTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>EIA Price (USD)</th>
                <th>Yahoo Price (USD)</th>
            </tr>
        </thead>
        <tbody id="historyBody"></tbody>
    </table>

    <script>
        // Load history.csv once — used for both latest price and history table
        fetch("history.csv")
            .then(r => {
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.text();
            })
            .then(text => {
                const rows = text.trim().split("\n")
                    .slice(1)                        // skip header
                    .filter(l => l.trim() !== "");   // ignore blank lines

                // --- Latest price ---
                if (rows.length === 0) {
                    document.getElementById("latestPrice").textContent =
                        "Latest price: Data unavailable";
                } else {
                    const last = rows[rows.length - 1].split(",");
                    const date = (last[0] || "").trim();
                    const eia  = parseFloat(last[1]);
                    const yahoo = parseFloat(last[2]);

                    let price = null;
                    if (!isNaN(yahoo))     price = yahoo.toFixed(2);
                    else if (!isNaN(eia))  price = eia.toFixed(2);

                    if (price && date) {
                        document.getElementById("latestPrice").innerHTML =
                            `Latest price: <strong>${price} USD</strong> (${date})`;
                    } else {
                        document.getElementById("latestPrice").textContent =
                            "Latest price: Data unavailable";
                    }
                }

                // --- History table ---
                const body = document.getElementById("historyBody");
                if (rows.length === 0) {
                    const tr = document.createElement("tr");
                    tr.innerHTML =
                        `<td colspan="3" style="text-align:center;color:#888;">No history data available.</td>`;
                    body.appendChild(tr);
                } else {
                    rows.slice().reverse().forEach(row => {
                        const cols  = row.split(",");
                        const date  = (cols[0] || "").trim();
                        const eia   = parseFloat(cols[1]);
                        const yahoo = parseFloat(cols[2]);

                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td>${date || "—"}</td>
                            <td>${!isNaN(eia)   ? eia.toFixed(2)   : "Data unavailable"}</td>
                            <td>${!isNaN(yahoo) ? yahoo.toFixed(2) : "Data unavailable"}</td>
                        `;
                        body.appendChild(tr);
                    });
                }
            })
            .catch(err => {
                document.getElementById("latestPrice").textContent =
                    "Latest price: Data unavailable";
                const body = document.getElementById("historyBody");
                const tr = document.createElement("tr");
                const msg = err && err.message === "HTTP 404"
                    ? "history.csv was not found. Please add the file and push."
                    : "Could not load price history. Please ensure history.csv is present and valid.";
                tr.innerHTML =
                    `<td colspan="3" style="text-align:center;color:#c00;">${msg}</td>`;
                body.appendChild(tr);
            });

        // Load 30-day change
        fetch("change30d.txt")
            .then(r => {
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.text();
            })
            .then(val => {
                const num = parseFloat(val);
                if (isNaN(num)) {
                    document.getElementById("change30d").textContent =
                        "30\u2011day change: Data unavailable";
                    return;
                }
                const color = num >= 0 ? "green" : "red";
                document.getElementById("change30d").innerHTML =
                    `30\u2011day change: <span style="color:${color}">${num.toFixed(2)}%</span>`;
            })
            .catch(() => {
                document.getElementById("change30d").textContent =
                    "30\u2011day change: Data unavailable";
            });

        // THEME SWITCHER
        const chartImg = document.getElementById("chartImg");
        const themeBtn = document.getElementById("themeBtn");

        function applyTheme() {
            const dark = localStorage.getItem("darkmode") === "1";
            chartImg.src = dark ? "chart_dark.png" : "chart_light.png";
            themeBtn.textContent = dark ? "Switch to Light Mode" : "Switch to Dark Mode";
        }

        themeBtn.onclick = () => {
            const dark = localStorage.getItem("darkmode") === "1";
            localStorage.setItem("darkmode", dark ? "0" : "1");
            applyTheme();
        };

        applyTheme();
    </script>

</body>
</html>
